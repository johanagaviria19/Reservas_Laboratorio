{% extends 'reservaTuLab/base.html' %}

{% block content %}
<h1 class="mb-4">Estadísticas de Uso</h1>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Laboratorios más Reservados</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Laboratorio</th>
                            <th>Total Reservas</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in estadisticas %}
                        <tr>
                            <td>{{ item.laboratorio }}</td>
                            <td>{{ item.total }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2">No hay datos disponibles.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
